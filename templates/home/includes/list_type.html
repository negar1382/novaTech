<!-- Bootstrap Icons - می‌تونی توی base.html هم یک بار لینکش کنی -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<div class="cat-slider-wrapper" dir="rtl">


    <div class="cat-slider-track" id="catSliderTrack">
        {% for category in categories %}
        <a href="{% url 'category_products' category.id %}" class="cat-item">
            <div class="cat-icon-box">
                <i class="bi {{ category.icon_class }}"></i>
            </div>
            <span class="cat-name">{{ category.name }}</span>
        </a>
        {% endfor %}
    </div>


</div>
